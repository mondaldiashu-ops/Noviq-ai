<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoviqAI — Universal AI</title>

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#070a12;
  color:#fff;
  min-height:100vh;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:#0b0f19;
  border-right:1px solid #202738;
  padding:18px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow-y:auto;
}

.logo{
  font-size:25px;
  font-weight:800;
  margin-bottom:25px;
}

.logo span{
  color:#6c7cff;
}

.newchat{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#5967ff;
  color:white;
  font-size:15px;
  cursor:pointer;
  margin-bottom:20px;
}

.menu-title{
  color:#7d879d;
  font-size:12px;
  margin:18px 5px 8px;
  text-transform:uppercase;
}

.menu button{
  width:100%;
  text-align:left;
  padding:11px;
  margin:3px 0;
  border:0;
  border-radius:9px;
  background:transparent;
  color:#d8ddec;
  cursor:pointer;
}

.menu button:hover{
  background:#151b2b;
}

/* MAIN */
.main{
  margin-left:260px;
  width:calc(100% - 260px);
  min-height:100vh;
}

.topbar{
  height:65px;
  border-bottom:1px solid #202738;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  background:#080c15;
  position:sticky;
  top:0;
  z-index:10;
}

.topbar h2{
  font-size:19px;
}

.status{
  font-size:12px;
  color:#72e6a8;
}

/* HOME */
.home{
  max-width:1100px;
  margin:auto;
  padding:55px 25px;
}

.hero{
  text-align:center;
  margin-bottom:45px;
}

.hero h1{
  font-size:46px;
  margin-bottom:15px;
}

.hero h1 span{
  color:#7180ff;
}

.hero p{
  color:#9ba5ba;
  max-width:700px;
  margin:auto;
  line-height:1.7;
}

/* FEATURES */
.features{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:15px;
}
